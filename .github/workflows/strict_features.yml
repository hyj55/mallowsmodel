name: Recover strict feature study
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: strict-feature-recovery
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check published estimators and simulation controls
        run: python -m pytest -q tests/test_strict_features.py
      - name: Retrieve unchanged pinned sources and audit every candidate
        run: |
          python -u download_strict_data.py
          python -u download_strict_tricot.py
      - name: Reproduce all 4760 original training datasets
        run: |
          python -u run_strict_simulations.py --part bridge
          python -u run_strict_simulations.py --part shell
          python -u run_strict_simulations.py --part coverage
      - name: Reproduce all 16 real tasks and frozen follow-ups
        run: |
          python -u run_strict_real.py
          python -u run_strict_followups.py --part budgets
          python -u run_strict_followups.py --part objective
      - name: Validate replay and generate figures
        run: |
          python validate_strict_features.py
          python make_strict_figures.py
      - name: Save generated outputs and actual run status
        if: always()
        env:
          RUN_OUTCOME: ${{ job.status }}
        run: |
          mkdir -p results/strict_features
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('results/strict_features/recovery_status.json')
          p.write_text(json.dumps({
              'status':os.environ['RUN_OUTCOME'],
              'run_id':os.environ['GITHUB_RUN_ID'],
              'source_commit':os.environ['GITHUB_SHA'],
              'workflow_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          },indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- results/strict_features
          for p in data/strict_feature_sources.json data/strict_tricot_sources.json figures/strict_features; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reproduce strict feature results ($RUN_OUTCOME)"
          git pull --rebase origin main
          git push origin HEAD:main
