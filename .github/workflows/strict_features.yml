name: Verify scientific comparison
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Mathematical and domain checks
        run: python -m pytest -q
      - name: Check repository and recorded-result consistency
        run: |
          python validation_artifacts.py
          python validate_scientific_audit.py --repository-only
          python validate_validation_extension.py --repository-only
          python validate_group_sensitivity.py --repository-only
          python validate_repeated_holdout.py --repository-only
          python validate_pair_features.py
          python validate_structure_features.py
